name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore and audit packages
        run: dotnet restore Arbitrator.slnx

      - name: Check formatting
        run: dotnet format Arbitrator.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Arbitrator.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test --project tests/Arbitrator.Tests --configuration Release --no-build
          --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: Pack
        run: dotnet pack src/Arbitrator --configuration Release --no-build --output artifacts/packages

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          retention-days: 14
          if-no-files-found: error
